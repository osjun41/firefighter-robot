[project]
name = "firefighter-isaaclab"
version = "0.1.0"
description = "Locomotion policy training and evaluation (Isaac Lab 2.1 / Isaac Sim 4.5, MuJoCo sim2sim)"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "isaacsim[all,extscache]==4.5.0",
  "isaaclab[isaacsim,all]==2.1.0",
  "numpy",
  "omegaconf",
  "mujoco",
  "onnxruntime",
  "cc.udp",
  "inputs",
  "pyaml",
  "scipy",
  "matplotlib",
  "berkeley_humanoid_lite",
  "berkeley_humanoid_lite_assets",
  "berkeley_humanoid_lite_lowlevel",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
isaacsim = { index = "nvidia" }
isaaclab = { index = "nvidia" }
berkeley_humanoid_lite = { path = "../../source/berkeley_humanoid_lite", editable = true }
berkeley_humanoid_lite_assets = { path = "../../source/berkeley_humanoid_lite_assets", editable = true }
berkeley_humanoid_lite_lowlevel = { path = "../../source/berkeley_humanoid_lite_lowlevel", editable = true }

[tool.uv.extra-build-dependencies]
# flatdict (required by isaaclab) imports pkg_resources, removed in setuptools 81
flatdict = ["setuptools<81"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true
